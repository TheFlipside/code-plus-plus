[package]
name = "codepp-udl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "User Defined Language (UDL) XML parser and in-memory model, matching Notepad++'s UDL v2.1 format."

[lints]
workspace = true

[lib]
name = "codepp_udl"

[dependencies]
# `open_regular_file`, so a named pipe or a device among the UDLs is
# refused rather than waited on.
codepp-platform = { workspace = true }
quick-xml = { workspace = true }
serde     = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]
# tempfile: registry-scan tests need a fresh directory populated
# with fixture UDL files. Workspace-shared to inherit the common
# version pin.
tempfile = { workspace = true }

# `mkfifo` and `O_NONBLOCK` for the test that a named pipe among the UDLs
# is skipped rather than waited on.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
