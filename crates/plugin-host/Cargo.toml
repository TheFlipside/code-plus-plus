[package]
name = "codepp-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Notepad++-compatible plugin host: NPPM/NPPN dispatcher, lifecycle, lazy DLL loading."

[lints]
workspace = true

[lib]
name = "codepp_plugin_host"

[features]
# `NotifyTargets::of_handlers`, which lets another crate's tests deliver
# a notification to a handler of their own without loading a plugin.
# Enabled from a dev-dependency only, so no shipped build has it.
test-support = []

[dependencies]
codepp-core     = { workspace = true }
codepp-editor   = { workspace = true }
codepp-platform = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
