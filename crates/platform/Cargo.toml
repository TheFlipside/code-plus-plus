[package]
name = "codepp-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OS-specific utilities: config paths, dynamic library loading, file watching."

[lints]
workspace = true

[lib]
name = "codepp_platform"

[dependencies]
crossbeam-channel = { workspace = true }
notify            = { workspace = true }
# Unpredictably-named, `O_EXCL`-created temp files for the plugin
# staging copy — the same construction `codepp-shell`'s find-in-files
# replacement and `core::session` already use, and for the same reason
# (a predictable temp name next to a world-writable destination is a
# link-planting target). MIT OR Apache-2.0.
tempfile          = { workspace = true }
tracing           = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # `panel_key`: DPAPI for the key at rest, CNG for its randomness and
    # for HMAC-SHA256 — Windows' own, so no crypto crate is added.
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

# The dlopen/dlsym/dlclose arm of `dynlib` on Unix (Linux plugin loading).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
