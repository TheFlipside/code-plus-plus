[package]
name = "codepp-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OS-specific utilities: config paths, dynamic library loading, file watching."

[lints]
workspace = true

[lib]
name = "codepp_platform"

[dependencies]
crossbeam-channel = { workspace = true }
notify            = { workspace = true }
# Unpredictably-named, `O_EXCL`-created temp files for the plugin
# staging copy — the same construction `codepp-shell`'s find-in-files
# replacement and `core::session` already use, and for the same reason
# (a predictable temp name next to a world-writable destination is a
# link-planting target). MIT OR Apache-2.0.
tempfile          = { workspace = true }
tracing           = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # `panel_key`: DPAPI for the key at rest, CNG for its randomness and
    # for HMAC-SHA256 — Windows' own, so no crypto crate is added.
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

# The dlopen/dlsym/dlclose arm of `dynlib` on Unix (Linux and macOS
# plugin loading), and `flock` / `geteuid` / `getrandom` (Linux) /
# `getentropy` (macOS) for `panel_key`'s Unix backend. macOS's HMAC and
# ACL calls are in libSystem too, declared where they are used, so no
# crate is added for them.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# `panel_key` on Linux: HMAC-SHA256 through GLib's `GHmac` — the
# platform's own primitive in the sense CNG is Windows', already mapped
# into every process of the GTK backend, so no crypto crate is added.
[target.'cfg(target_os = "linux")'.dependencies]
glib-sys = { workspace = true }
