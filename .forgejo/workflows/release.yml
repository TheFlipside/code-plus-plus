name: Release

# Builds and publishes a release when a version tag is pushed:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The tag must be `v` + the version in Cargo.toml, and nothing more: a
# release has a plain version (docs/DESIGN.md §11.6).
# docs/RELEASING.md has the whole procedure, the secrets this needs and
# what each runner must have installed.
#
# Each platform gets an archive to unpack and a package to install: a
# zip and an .msi for Windows, a tarball and a .deb for Linux, a zip and
# a .dmg for each macOS architecture.
#
# A manual run ("Run workflow") builds and packages everything and
# publishes nothing: the files stay on the run as artifacts. Use it to
# try the pipeline without creating a tag or a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The release is written with the three tokens in `secrets`, not with
# the run's own token, which therefore needs nothing beyond reading.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The updater of the Windows build (docs/DESIGN.md §11): where an
  # installed Code++ asks for the newest version, and the public half of
  # the key updates are signed with. Neither is a secret. Both are
  # compiled into the Windows build, which is the only one that reads
  # them, and update_feed.py holds the first against where it publishes
  # the feed and the second against the private key it signs with.
  # Neither may ever change for the copies already installed: they ask
  # that address, and trust that key, for good.
  CODEPP_UPDATE_FEED_URL: https://git.fiedler.live/tux/code-plus-plus/raw/branch/appcast/windows-x64.xml
  CODEPP_UPDATE_PUBLIC_KEY: N5vTYIYXYUHRY5wE/P7/duraTr9JV7oMCqhf9FWbBwo=

# Hardening, on the same reasoning as ci.yml:
#   - Every external action is named by its full `https://github.com/...`
#     URL and pinned to a commit SHA. The two artifact actions are the
#     commits their `v3` tags named when this was written; v3 is the
#     last artifact protocol Forgejo's runner speaks. To bump one, look
#     the tag up with `git ls-remote https://github.com/actions/<name>.git
#     'refs/tags/v3*'` and change the SHA and the comment together.
#   - No `actions/cache`: the runners keep `target/` and `~/.cargo`.
#   - The tools a run fetches are pinned: cargo-about by the
#     `--version` below, and WiX, which builds the Windows installer, by
#     the version and the SHA-256 of its two package files in
#     package-windows.ps1, which uses no cached copy of either.
#   - The build jobs get no secrets. The three tokens reach the
#     Linux runner only: `prepare` checks that they are set and that
#     the update feed has a branch to go to, and `publish` uses them.
#     `publish` runs nothing a build produced; it only hashes, signs
#     and uploads the files.
#   - The key updates are signed with reaches one step of `publish` and
#     nothing else, not even `prepare`: update_feed.py hands it to
#     `openssl` through a pipe, and no file ever holds it. That step
#     runs before anything is published, so a missing or wrong key
#     stops the release with nothing out.
#   - Nothing from the tag reaches a shell as text. `prepare` checks
#     that the tag is exactly `v` + Cargo.toml's x.y.z and hands the
#     version on; steps read it from the environment.

jobs:
  # Decides the version, refuses a tag that does not match Cargo.toml,
  # and writes the licence notices of the bundled crates, which every
  # archive and package carries.
  prepare:
    name: prepare
    runs-on: linux
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      # The whole history, for the check below that the tag is on main.
      - name: Checkout (pinned to actions/checkout v4.3.1)
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          fetch-depth: 0

      - name: Decide the version
        id: version
        run: |
          set -euo pipefail
          bash .forgejo/scripts/release-version.sh > release-version.txt
          cat release-version.txt
          cat release-version.txt >> "$GITHUB_OUTPUT"

      # A release is cut from main, where CI has run on every commit. A
      # tag on a commit main does not contain, a branch's tip or a stray
      # local commit, is refused rather than published. Not asked of a
      # manual run, which publishes nothing and may rehearse a branch.
      - name: Check the tagged commit is on main
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::the checkout has no origin/main to compare the tag with" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::the tagged commit $(git rev-parse HEAD) is not on main; a release is tagged on a commit of main (docs/RELEASING.md)" >&2
            exit 1
          fi

      # Before the builds, not after them: a missing token would
      # otherwise surface only once everything is built, or, for the
      # GitHub one, once the Forgejo release is already out.
      - name: Check the release tokens are configured
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${PACKAGES_TOKEN:-}" ]; then
            echo "::error::the PACKAGES_TOKEN secret is not set (docs/RELEASING.md)" >&2
            missing=1
          fi
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::the RELEASE_TOKEN secret is not set (docs/RELEASING.md)" >&2
            missing=1
          fi
          if [ -z "${GH_RELEASE_TOKEN:-}" ]; then
            echo "::error::the GH_RELEASE_TOKEN secret is not set (docs/RELEASING.md)" >&2
            missing=1
          fi
          exit "$missing"

      # The feed that offers the release to installed copies is
      # published on the `appcast` branch, at the address the builds
      # are given above. Without the branch, or with another address,
      # the release would go out and no installed Code++ would learn
      # of it; so look before building.
      - name: Check the update feed can be published
        if: steps.version.outputs.publish == 'true'
        env:
          FORGEJO_URL: https://git.fiedler.live
          REPO: tux/code-plus-plus
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 .forgejo/scripts/update_feed.py check

      # Pinned, so that the notices are generated by the version
      # about.toml and about.hbs were written against. A second run
      # finds it installed and returns at once.
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.3 --features cli

      # `--fail`: a crate whose licence is not in about.toml's
      # `accepted` list, or cannot be read, stops the release here.
      - name: Generate the crate licence notices
        run: |
          set -euo pipefail
          mkdir -p release-notices
          cargo about generate --fail --locked --workspace \
            --output-file release-notices/THIRD_PARTY_CRATES.md about.hbs
          test -s release-notices/THIRD_PARTY_CRATES.md

      - name: Upload the notices (pinned to actions/upload-artifact v3.2.1)
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: notices
          path: release-notices/THIRD_PARTY_CRATES.md
          if-no-files-found: error

  build-windows:
    name: build (windows-x64)
    needs: prepare
    runs-on: windows
    steps:
      - name: Checkout (pinned to actions/checkout v4.3.1)
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Download the notices (pinned to actions/download-artifact v3.0.2)
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: notices
          path: release-notices

      - name: rustup target add
        run: rustup target add x86_64-pc-windows-msvc

      # `--locked`: a release is built from the Cargo.lock that was
      # tagged, or not at all. The three plugins are the preinstalled
      # ones; `example-hello`, the SDK sample, is not shipped.
      - name: cargo build
        env:
          CODEPP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p codepp-app -p codepp-cppmimetools -p codepp-cppconverter -p codepp-cppexport

      # The zip and the .msi. The installer is built with WiX, which the
      # script fetches from nuget.org, and carries WinSparkle.dll, which
      # it fetches from WinSparkle's releases on GitHub; it checks both
      # against the hashes it holds. The runner needs .NET to run WiX
      # (docs/RELEASING.md).
      - name: Package
        shell: powershell
        env:
          CODEPP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .forgejo/scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc -Label windows-x64 -Notices release-notices/THIRD_PARTY_CRATES.md -OutDir dist-release
          exit $LASTEXITCODE

      - name: Upload the zip and the installer (pinned to actions/upload-artifact v3.2.1)
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: windows-x64
          path: dist-release/*
          if-no-files-found: error

  build-linux:
    name: build (linux-amd64)
    needs: prepare
    runs-on: linux
    steps:
      - name: Checkout (pinned to actions/checkout v4.3.1)
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Download the notices (pinned to actions/download-artifact v3.0.2)
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: notices
          path: release-notices

      - name: rustup target add
        run: rustup target add x86_64-unknown-linux-gnu

      - name: cargo build
        env:
          CODEPP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu -p codepp-app -p codepp-cppmimetools -p codepp-cppconverter -p codepp-cppexport

      # The tarball and the .deb.
      - name: Package
        env:
          CODEPP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash .forgejo/scripts/package-unix.sh x86_64-unknown-linux-gnu linux-amd64 release-notices/THIRD_PARTY_CRATES.md dist-release

      - name: Upload the tarball and the package (pinned to actions/upload-artifact v3.2.1)
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: linux-amd64
          path: dist-release/*
          if-no-files-found: error

  # Both architectures on the one macOS runner: whichever is not the
  # host's is cross-compiled, which needs only its Rust target, since
  # Apple's clang and SDK serve both.
  build-macos:
    name: build (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        include:
          - target: aarch64-apple-darwin
            label: macos-arm64
          - target: x86_64-apple-darwin
            label: macos-x64
    runs-on: macos
    steps:
      - name: Checkout (pinned to actions/checkout v4.3.1)
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Download the notices (pinned to actions/download-artifact v3.0.2)
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: notices
          path: release-notices

      - name: rustup target add
        run: rustup target add ${{ matrix.target }}

      - name: cargo build
        env:
          CODEPP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p codepp-app -p codepp-cppmimetools -p codepp-cppconverter -p codepp-cppexport

      # The zip and the .dmg.
      - name: Package
        env:
          CODEPP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash .forgejo/scripts/package-unix.sh ${{ matrix.target }} ${{ matrix.label }} release-notices/THIRD_PARTY_CRATES.md dist-release/${{ matrix.label }}

      # A folder per architecture, so that the two jobs cannot pick up
      # each other's files if the runner gives them one work directory.
      - name: Upload the zip and the disk image (pinned to actions/upload-artifact v3.2.1)
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: ${{ matrix.label }}
          path: dist-release/${{ matrix.label }}/*
          if-no-files-found: error

  # Signs the Windows installer, publishes to Forgejo and then to the
  # GitHub mirror, puts the Debian package into the apt repository, and
  # last of all publishes the feed that offers the release to installed
  # copies. Runs for a tag only, and only when
  # every build succeeded: a release has all eight files or does not
  # exist. Every part can be run again for the same tag: each release
  # has its files replaced, and the feed is left alone when it already
  # says the same.
  publish:
    name: publish
    needs: [prepare, build-windows, build-linux, build-macos]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: linux
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      FORGEJO_URL: https://git.fiedler.live
      REPO: tux/code-plus-plus
    steps:
      # The whole history, for the list of changes in the notes.
      - name: Checkout (pinned to actions/checkout v4.3.1)
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          fetch-depth: 0

      - name: Download the Windows files (pinned to actions/download-artifact v3.0.2)
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: windows-x64
          path: release-files

      - name: Download the Linux files (pinned to actions/download-artifact v3.0.2)
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: linux-amd64
          path: release-files

      - name: Download the macOS arm64 files (pinned to actions/download-artifact v3.0.2)
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: macos-arm64
          path: release-files

      - name: Download the macOS x64 files (pinned to actions/download-artifact v3.0.2)
        uses: https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: macos-x64
          path: release-files

      # Exactly the eight files, by name: the notes name them, and a
      # release missing one should not go out.
      - name: Check the files and write SHA256SUMS
        run: |
          set -euo pipefail
          cd release-files
          for name in \
            "codepp-windows-x64-$VERSION.zip" \
            "codepp-windows-x64-$VERSION.msi" \
            "codepp-linux-amd64-$VERSION.tar.gz" \
            "codepp-linux-amd64-$VERSION.deb" \
            "codepp-macos-arm64-$VERSION.zip" \
            "codepp-macos-arm64-$VERSION.dmg" \
            "codepp-macos-x64-$VERSION.zip" \
            "codepp-macos-x64-$VERSION.dmg"; do
            [ -s "$name" ] || { echo "::error::missing file: $name" >&2; exit 1; }
          done
          # Regular files only. A link among the artifacts would be
          # hashed and uploaded as whatever it points at on this runner.
          other=$(find . -mindepth 1 ! -type f)
          [ -z "$other" ] || { echo "::error::not a regular file: $other" >&2; exit 1; }
          count=$(find . -type f | wc -l)
          [ "$count" -eq 8 ] || { echo "::error::expected 8 files, found $count" >&2; ls -la; exit 1; }
          # The shell expands `*` before it creates SHA256SUMS, so the
          # file does not list itself.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Before anything is published: a missing key, or one that is
      # not the private half of the public key the builds carry, stops
      # the release here. The feed goes into a folder of its own, not
      # among the release's files, and is published by the last step.
      - name: Sign the Windows installer and write its update feed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python3 .forgejo/scripts/update_feed.py sign "release-files/codepp-windows-x64-$VERSION.msi" update-feeds/windows-x64.xml

      - name: Write the release notes
        run: |
          set -euo pipefail
          bash .forgejo/scripts/release-notes.sh "$TAG" "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Publish the Forgejo release
        env:
          RELEASE_NAME: Code++ ${{ github.ref_name }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 .forgejo/scripts/publish_forgejo.py release-files release-notes.md

      # The mirror receives the tag from Forgejo's push mirror, not from
      # this job, so wait for it: `gh release create` on a tag GitHub
      # does not have yet would create that tag itself, on the default
      # branch's newest commit rather than on the commit that was built.
      - name: Wait for the tag on the GitHub mirror
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: TheFlipside/code-plus-plus
        run: |
          set -euo pipefail
          want=$(git rev-parse 'HEAD^{commit}')
          found=""
          for attempt in $(seq 1 60); do
            # `commits/refs/tags/<tag>` answers with the commit, also for
            # an annotated tag. (`commits/tags/<tag>` is refused.)
            found=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha 2>gh-error.txt || true)
            if [ "$found" = "$want" ]; then
              break
            fi
            echo "attempt $attempt: the mirror does not have $TAG at $want yet"
            sleep 10
          done
          if [ "$found" != "$want" ]; then
            # What gh last said tells a tag that has not arrived ("No
            # commit found") from a token that may not read the mirror.
            cat gh-error.txt >&2 || true
            echo "::error::GitHub mirror: tag $TAG is not at $want after 10 minutes. Sync the push mirror in the repository's settings, then run this job again." >&2
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: TheFlipside/code-plus-plus
          RELEASE_NAME: Code++ ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only "there is no such release" (HTTP 404) means create one.
          # Any other failure of the lookup, a token that was refused or
          # a network error, stops here with what gh said, rather than
          # going on to a `create` that fails for a reason of its own.
          if gh api "repos/$GH_REPO/releases/tags/$TAG" >/dev/null 2>gh-error.txt; then
            echo "GitHub release $TAG exists; replacing its files"
            gh release upload "$TAG" release-files/* --clobber
          elif ! grep -q 'HTTP 404' gh-error.txt; then
            cat gh-error.txt >&2
            echo "::error::could not look up the GitHub release for $TAG" >&2
            exit 1
          else
            gh release create "$TAG" --title "$RELEASE_NAME" \
              --notes-file release-notes.md release-files/*
          fi

      # The apt repository Forgejo keeps for the owner (docs/DESIGN.md
      # §11.9): whoever has added it gets this version from `apt
      # upgrade`. A version is published there once; a second run finds
      # the package and leaves it. Either way the package is then read
      # back, and one that is not the release's fails the step. With a
      # token of its own, which can write packages and nothing else.
      - name: Publish the Debian package to the package registry
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: python3 .forgejo/scripts/publish_deb.py "release-files/codepp-linux-amd64-$VERSION.deb"

      # Last, once both releases are out: from this commit on, installed
      # copies are offered the release. The script first downloads the
      # installer from the address the feed names and requires it to be
      # the file that was signed, so the feed never names a file that
      # is not there.
      - name: Publish the Windows update feed
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 .forgejo/scripts/update_feed.py publish "release-files/codepp-windows-x64-$VERSION.msi" update-feeds/windows-x64.xml
