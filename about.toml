# Configuration for `cargo about`, which writes THIRD_PARTY_CRATES.md:
# the licence notices of the Rust crates compiled into Code++ and its
# bundled plugins. The release workflow generates the file and puts it
# in every archive (docs/RELEASING.md, THIRD_PARTY_LICENSES.md §3):
#
#     cargo about generate --fail --locked --workspace \
#         --output-file THIRD_PARTY_CRATES.md about.hbs

# The licences a dependency may carry. Keep this the same list as
# `[licenses].allow` in deny.toml, which is what CI enforces on every
# push: a licence missing here fails the release for a dependency CI
# accepted, and one missing there would let a release name a licence CI
# never checked.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]

# One file for every platform a release is built for, so that the four
# archives carry the same notices: a crate only the Windows build links
# is listed in the macOS archive too, which costs a few lines there.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Only what is compiled into the shipped binaries. Build scripts and
# their dependencies run on the build machine, and dev-dependencies are
# linked into tests.
ignore-build-dependencies = true
ignore-dev-dependencies = true
