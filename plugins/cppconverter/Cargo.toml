[package]
name = "codepp-cppconverter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Code++ preinstalled plugin: ASCII↔HEX selection conversion. Clean-room MIT reimplementation of Notepad++'s NppConverter."

[lints]
workspace = true

[lib]
# `cdylib` produces `cppconverter.dll` on Windows (`LoadLibraryW`) and
# `.so`/`.dylib` on Linux/macOS (`dlopen`). Same story as cppmimetools.
crate-type = ["cdylib"]
name = "cppconverter"

# Cross-platform: Windows (LoadLibraryW), Linux and macOS (dlopen).
# The gate mirrors this plugin's `mod imp` gate — see
# `codepp_platform::BUNDLED_PLUGINS`, which must agree with both.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
codepp-plugin-sdk = { workspace = true }

[build-dependencies]
# Embeds `VS_VERSION_INFO` into the cdylib so the Plugin Manager
# dialog reads the version straight from this manifest.
codepp-build-helpers = { workspace = true }
