[package]
name = "codepp-example-hello"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "In-tree sample Notepad++-compatible plugin: inserts 'Hello from plugin' into the active buffer."

[lints]
workspace = true

[lib]
# `cdylib` produces a regular Win32 DLL (`.dll`) on Windows that the
# Code++ plugin host loads via `LoadLibraryW`, and a `.so`/`.dylib` on
# Linux/macOS that it loads via `dlopen`. The output filename uses
# `name`, not the package name, so the host sees `example_hello.dll`
# rather than `codepp-example-hello.dll`.
crate-type = ["cdylib"]
name = "example_hello"

# Cross-platform: Windows (LoadLibraryW), Linux and macOS (dlopen).
# The gate mirrors this plugin's `mod imp` gate — see
# `codepp_platform::BUNDLED_PLUGINS`, which must agree with both.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
codepp-plugin-sdk = { workspace = true }

[build-dependencies]
# Embeds `VS_VERSION_INFO` into the cdylib so the Plugin Manager
# dialog reads the version straight from this manifest.
codepp-build-helpers = { workspace = true }
